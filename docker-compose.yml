services:
  moto-server:
    image: motoserver/moto
    container_name: moto-server
    ports:
      - "${MOTO_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network_local

  init-dynamo:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./:/work
    working_dir: /work
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://moto-server:5000 >/dev/null 2>&1; do
          echo "Waiting for moto-server..."; sleep 2
        done
        if ! aws dynamodb describe-table --table-name "${AWS_DYNAMODB_TABLE_NAME}" --endpoint-url http://moto-server:5000 >/dev/null 2>&1; then
          aws dynamodb create-table \
            --cli-input-json file://.dynamodb-local-config.json \
            --endpoint-url http://moto-server:5000
        fi
    environment:
      - AWS_DYNAMODB_TABLE_NAME=${AWS_DYNAMODB_TABLE_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - network_local

networks:
  network_local:
    external: true
    name: shared_network_local

services:
  moto-server:
    image: motoserver/moto
    container_name: moto-server
    ports:
      - "${MOTO_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network_local

  init-dynamo:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./:/work
    working_dir: /work
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://moto-server:5000 >/dev/null 2>&1; do
          echo "Waiting for moto-server..."; sleep 2
        done
        if ! aws dynamodb describe-table --table-name "${AWS_DYNAMODB_TABLE_NAME}" --endpoint-url http://moto-server:5000 >/dev/null 2>&1; then
          aws dynamodb create-table \
            --cli-input-json file://.dynamodb-local-config.json \
            --endpoint-url http://moto-server:5000
        fi
    environment:
      - AWS_DYNAMODB_TABLE_NAME=${AWS_DYNAMODB_TABLE_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - network_local

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"
    depends_on:
      - jaeger
      - prometheus
    networks:
      - network_local
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - network_local

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - network_local

networks:
  network_local:
    external: true
    name: service_portal_state_network
